services:
  - type: web
    name: finn-investment-agent
    runtime: docker
    plan: free
    branch: master
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: FINN_MODE
        value: live
      - key: FINN_EXCHANGE_SOURCE
        value: nse
      - key: FINN_STARTUP_SYNC
        value: "false"
      - key: DATA_DIR
        value: /tmp/finn-data
      - key: DATABASE_PATH
        value: /tmp/finn-data/finn.db
      - key: PYTHONUNBUFFERED
        value: "1"
